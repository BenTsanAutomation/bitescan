<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="biteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#facc15"/>
      <stop offset="100%" style="stop-color:#eab308"/>
    </linearGradient>
    <clipPath id="biteMask">
      <path d="M0,0 H512 V512 H0 Z M400,80 
               Q440,100 450,140
               Q460,180 440,210
               Q420,240 380,240
               Q340,240 320,200
               Q300,160 320,120
               Q340,80 380,70
               Q390,68 400,80 Z"/>
    </clipPath>
  </defs>
  
  <!-- Background circle with bite taken out -->
  <g clip-path="url(#biteMask)">
    <circle cx="256" cy="256" r="240" fill="url(#plateGrad)"/>
    
    <!-- Inner plate ring -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.3"/>
    
    <!-- Plate shine -->
    <ellipse cx="200" cy="180" rx="80" ry="40" fill="#ffffff" opacity="0.15"/>
  </g>
  
  <!-- Checkmark -->
  <path d="M180 260 L230 310 L340 200" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Bite mark accent (yellow crumbs) -->
  <circle cx="420" cy="100" r="12" fill="url(#biteGrad)"/>
  <circle cx="450" cy="140" r="8" fill="url(#biteGrad)"/>
  <circle cx="440" cy="180" r="10" fill="url(#biteGrad)"/>
  
  <!-- Small leaf accent -->
  <path d="M380 50 Q400 30 420 50 Q400 70 380 50 Z" fill="#22c55e"/>
  <path d="M400 50 L400 70" stroke="#16a34a" stroke-width="2"/>
</svg>
